<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><style>.box{fill:#fff;stroke:#333;stroke-width:2;rx:14}.head{font:700 24px Arial,sans-serif}.txt{font:16px Arial,sans-serif}.small{font:15px Arial,sans-serif}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="800" y="50" text-anchor="middle" class="head">PAN-OS: File Blocking Does Not Override Antivirus</text><rect class="box" x="100" y="180" width="260" height="90"/><text x="230" y="215" text-anchor="middle" class="txt"><tspan x="230">Client downloads known-good EXE</tspan><tspan x="230" dy="24">SHA-256 = H1</tspan></text><rect class="box" x="470" y="180" width="260" height="90"/><text x="600" y="210" text-anchor="middle" class="txt"><tspan x="600">Security Policy</tspan><tspan x="600" dy="24">Action = allow</tspan><tspan x="600" dy="24">Profiles attached</tspan></text><path class="line" d="M360 225 H470"/><rect class="box" x="260" y="380" width="380" height="120"/><text x="450" y="410" text-anchor="middle" class="txt"><tspan x="450">File Blocking Profile</tspan><tspan x="450" dy="24">Match: application + file type + direction</tspan><tspan x="450" dy="24">PE action = alert / not blocked</tspan></text><rect class="box" x="820" y="380" width="420" height="120"/><text x="1030" y="410" text-anchor="middle" class="txt"><tspan x="1030">Antivirus Profile</tspan><tspan x="1030" dy="24">Traditional AV signature matches Threat ID T123</tspan><tspan x="1030" dy="24">AV enforcement still applies</tspan></text><path class="line" d="M600 270 V320 H450 V380"/><path class="line" d="M600 270 V320 H1030 V380"/><rect class="box" x="260" y="610" width="380" height="100"/><text x="450" y="646" text-anchor="middle" class="txt"><tspan x="450">File Blocking cannot say:</tspan><tspan x="450" dy="26">IF SHA-256 == H1 THEN bypass T123</tspan></text><path class="line" d="M450 500 V610"/><rect class="box" x="810" y="600" width="440" height="120"/><text x="1030" y="628" text-anchor="middle" class="small"><tspan x="1030">Traditional AV exception:</tspan><tspan x="1030" dy="22">Objects &gt; Security Profiles &gt; Antivirus</tspan><tspan x="1030" dy="22">&gt; Signature Exceptions</tspan><tspan x="1030" dy="22">Identifier = Threat ID / signature</tspan></text><path class="line" d="M1030 500 V600"/><rect class="box" x="560" y="770" width="500" height="100"/><text x="810" y="800" text-anchor="middle" class="small"><tspan x="810">Separate case: WildFire Inline ML</tspan><tspan x="810" dy="22">File Exception supports hash/partial-hash based exclusion</tspan><tspan x="810" dy="22">Not a general traditional-AV hash allowlist</tspan></text><path class="line" stroke-dasharray="7 7" d="M1030 720 V745 H810 V770"/></svg>