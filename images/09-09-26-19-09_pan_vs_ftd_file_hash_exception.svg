<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><style>.box{fill:#fff;stroke:#333;stroke-width:2;rx:14}.head{font:700 24px Arial,sans-serif}.sub{font:700 18px Arial,sans-serif}.txt{font:15px Arial,sans-serif}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="800" y="50" text-anchor="middle" class="head">False-Positive File Handling: PAN-OS vs Cisco Secure Firewall/FTD</text><rect class="box" x="80" y="110" width="650" height="60"/><text x="405" y="147" text-anchor="middle" class="sub">PAN-OS / Panorama</text><rect class="box" x="870" y="110" width="650" height="60"/><text x="1195" y="147" text-anchor="middle" class="sub">Cisco Secure Firewall / FTD + FMC</text><rect class="box" x="120" y="220" width="220" height="80"/><text x="230" y="252" text-anchor="middle" class="txt"><tspan x="230">Known-good file</tspan><tspan x="230" dy="22">SHA-256 = H1</tspan></text><rect class="box" x="430" y="210" width="260" height="100"/><text x="560" y="240" text-anchor="middle" class="txt"><tspan x="560">Traditional Antivirus signature</tspan><tspan x="560" dy="22">Threat ID = T123</tspan><tspan x="560" dy="22">Signature/pattern-based detection</tspan></text><path class="line" d="M340 260 H430"/><rect class="box" x="260" y="380" width="380" height="120"/><text x="450" y="410" text-anchor="middle" class="txt"><tspan x="450">Signature Exception</tspan><tspan x="450" dy="22">Objects &gt; Security Profiles &gt; Antivirus</tspan><tspan x="450" dy="22">&gt; Signature Exceptions</tspan><tspan x="450" dy="22">Scope: Threat ID/signature, not one SHA-256</tspan></text><path class="line" d="M560 310 V345 H450 V380"/><rect class="box" x="190" y="570" width="500" height="120"/><text x="440" y="600" text-anchor="middle" class="txt"><tspan x="440">Separate path: WildFire Inline ML</tspan><tspan x="440" dy="22">File Exception supports hash/partial hash + filename</tspan><tspan x="440" dy="22">This does NOT make traditional AV exceptions</tspan><tspan x="440" dy="22">into per-SHA-256 allowlisting</tspan></text><path class="line" stroke-dasharray="7 7" d="M450 500 V570"/><rect class="box" x="920" y="220" width="220" height="80"/><text x="1030" y="252" text-anchor="middle" class="txt"><tspan x="1030">Known-good file</tspan><tspan x="1030" dy="22">SHA-256 = H1</tspan></text><rect class="box" x="1230" y="220" width="240" height="80"/><text x="1350" y="252" text-anchor="middle" class="txt"><tspan x="1350">Malware/File policy</tspan><tspan x="1350" dy="22">Cloud disposition = Malware</tspan></text><path class="line" d="M1140 260 H1230"/><rect class="box" x="1050" y="390" width="350" height="110"/><text x="1225" y="420" text-anchor="middle" class="txt"><tspan x="1225">Clean List</tspan><tspan x="1225" dy="22">Add full SHA-256 H1</tspan><tspan x="1225" dy="22">Treat that exact file as clean</tspan><tspan x="1225" dy="22">for the applicable file policy</tspan></text><path class="line" d="M1350 300 V345 H1225 V390"/><rect class="box" x="1050" y="570" width="350" height="100"/><text x="1225" y="600" text-anchor="middle" class="txt"><tspan x="1225">Different SHA-256 H2</tspan><tspan x="1225" dy="22">Still evaluated normally</tspan><tspan x="1225" dy="22">No broad signature exception required</tspan></text><path class="line" d="M1225 500 V570"/><rect class="box" x="390" y="750" width="820" height="90"/><text x="800" y="785" text-anchor="middle" class="txt"><tspan x="800">Operational consequence: PAN-OS traditional AV false-positive handling can have a broader blast radius</tspan><tspan x="800" dy="24">because the exception is tied to the antivirus Threat ID/signature; FTD Clean List can target one exact SHA-256.</tspan></text><path class="line" d="M440 690 V715 H650 V750"/><path class="line" d="M1225 670 V715 H950 V750"/></svg>